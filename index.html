    <style>
        /* RESET & BASE 100% BLANCO ALINEADO A LA IZQUIERDA */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            background-color: #ffffff !important;
            color: #1e293b;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Alineación estricta al margen izquierdo */
            text-align: left;
            padding: 16px 0;
        }

        /* EFECTO LUMINOSO SUAVE AL PASAR EL MOUSE EN NAVEGADOR */
        .photo-card {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.25s ease;
            background-color: #ffffff !important;
            margin: 0 !important;
            text-align: left;
        }
        .photo-card:hover {
            transform: translateY(-2px);
        }
        .photo-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -120%;
            width: 50%;
            height: 200%;
            background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.6) 50%, transparent 70%);
            transform: skewX(-25deg);
            pointer-events: none;
            transition: left 0.6s ease;
            opacity: 0;
        }
        .photo-card:hover::after {
            left: 150%;
            opacity: 1;
        }

        /* VISOR MODAL EN BLANCO / OFF-WHITE TRASLÚCIDO */
        .gallery-lightbox[hidden] { display: none; }
        .gallery-lightbox {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }
        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .lightbox-shell {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            height: 92vh;
            max-height: 92dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }
        .lightbox-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .lightbox-counter {
            font-family: 'Space Grotesk', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 5px 12px;
            border-radius: 999px;
        }
        .lightbox-close-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #0f172a;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lightbox-close-btn:hover {
            background: #0f172a;
            color: #ffffff;
        }
        .lightbox-viewport {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #ffffff;
            border: 1px solid #f1f5f9;
            overflow: hidden;
        }
        .lightbox-slide-track {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            will-change: transform, opacity;
        }
        .lightbox-img.slide-right { animation: slideR 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .lightbox-img.slide-left { animation: slideL 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideR {
            from { opacity: 0; transform: translateX(35px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideL {
            from { opacity: 0; transform: translateX(-35px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .lightbox-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
        }
        .lightbox-nav-btn.prev { left: 12px; }
        .lightbox-nav-btn.next { right: 12px; }
        .lightbox-nav-btn:hover { background: #0f172a; color: #ffffff; }
    </style>
</head>

                    <img src="https://onceoncegrafica-1111.github.io/imagenes-email/imagen_29.webp" alt="Servicios de Gráfica 29" width="440" style="display: block; width: 100%; max-width: 440px; height: auto; border-radius: 12px; border: 0; outline: none; margin: 0;" />
                </div>
            </td>
        </tr>

    </table>

    <!-- MODAL LIGHTBOX EN BLANCO / OFF-WHITE -->
    <div class="gallery-lightbox" id="galleryLightbox" role="dialog" aria-modal="true" aria-label="Visor" hidden>
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-shell">
            <header class="lightbox-topbar">
                <span class="lightbox-counter" id="lightboxCounter">01 / 29</span>
                <button type="button" class="lightbox-close-btn" id="lightboxCloseBtn" aria-label="Cerrar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </header>

            <div class="lightbox-viewport" id="lightboxViewport">
                <button type="button" class="lightbox-nav-btn prev" id="lightboxPrevBtn" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </button>

                <div class="lightbox-slide-track">
                    <img class="lightbox-img" id="lightboxImg" src="" alt="Vista ampliada" />
                </div>

                <button type="button" class="lightbox-nav-btn next" id="lightboxNextBtn" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- MOTOR INTERACTIVO -->
    <script>
        (function() {
            const BASE_URL = 'https://onceoncegrafica-1111.github.io/imagenes-email/';
            const TOTAL = 29;
            const images = [];
            for (let i = 1; i <= TOTAL; i++) {
                images.push(`${BASE_URL}imagen_${String(i).padStart(2, '0')}.webp`);
            }

            const lightbox = document.getElementById('galleryLightbox');
            const backdrop = document.getElementById('lightboxBackdrop');
            const closeBtn = document.getElementById('lightboxCloseBtn');
            const prevBtn = document.getElementById('lightboxPrevBtn');
            const nextBtn = document.getElementById('lightboxNextBtn');
            const mainImg = document.getElementById('lightboxImg');
            const counter = document.getElementById('lightboxCounter');
            const viewport = document.getElementById('lightboxViewport');

            let currentIndex = 0;
            let isOpen = false;

            function updateSlide(dir = 'right') {
                mainImg.classList.remove('slide-right', 'slide-left');
                void mainImg.offsetWidth;
                mainImg.src = images[currentIndex];
                mainImg.classList.add(dir === 'right' ? 'slide-right' : 'slide-left');
                counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(TOTAL).padStart(2, '0')}`;
            }

            function openGallery(idx) {
                currentIndex = idx;
                isOpen = true;
                updateSlide('right');
                lightbox.hidden = false;
                document.body.style.overflow = 'hidden';
            }

            function closeGallery() {
                isOpen = false;
                lightbox.hidden = true;
                document.body.style.overflow = '';
            }

            function navigate(step) {
                if (!isOpen) return;
                currentIndex = (currentIndex + step + TOTAL) % TOTAL;
                updateSlide(step > 0 ? 'right' : 'left');
            }

            document.querySelectorAll('.photo-card').forEach(card => {
                card.addEventListener('click', () => {
                    const idx = parseInt(card.getAttribute('data-index') || '0', 10);
                    openGallery(idx);
                });
            });

            closeBtn.addEventListener('click', closeGallery);
            backdrop.addEventListener('click', closeGallery);
            prevBtn.addEventListener('click', () => navigate(-1));
            nextBtn.addEventListener('click', () => navigate(1));

            window.addEventListener('keydown', (e) => {
                if (!isOpen) return;
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowRight') navigate(1);
                if (e.key === 'ArrowLeft') navigate(-1);
            });

            let touchStartX = 0;
            viewport.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0]?.clientX || 0;
            }, { passive: true });
            viewport.addEventListener('touchend', (e) => {
                const diff = (e.changedTouches[0]?.clientX || 0) - touchStartX;
                if (Math.abs(diff) > 35) navigate(diff < 0 ? 1 : -1);
            }, { passive: true });
        })();
    </script>
</body>
</html>
