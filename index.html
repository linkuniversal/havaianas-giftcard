<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Havaianas® — Gift Card Digital</title>

  <!-- Precarga veloz del primer fondo -->
  <link rel="preload" as="image" href="./background.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./styles.css" />

  <!-- QR Generator (MIT, 12KB) & GSAP (Commercial Standard License) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- ESCENARIO DE FONDOS ANIMADOS (3 IMÁGENES CON CROSSFADE SUAVE) -->
  <div id="bg-stage" aria-hidden="true">
    <div class="bg-slide is-active" style="background-image: url('./background.webp');"></div>
    <div class="bg-slide" style="background-image: url('./backgroundii.webp');"></div>
    <div class="bg-slide" style="background-image: url('./backgroundiii.webp');"></div>
    <div class="bg-scrim"></div>
  </div>

  <!-- MOTOR 3D WEBGL -->
  <canvas id="webgl-canvas"></canvas>

  <!-- SOBRE DE APERTURA VELOZ Y TÁCTIL -->
  <div id="envelope-overlay" role="button" tabindex="0" aria-label="Abrir Gift Card Havaianas">
    <div class="envelope-card" id="envelope-card">
      <div class="envelope-rim"></div>
      <div class="envelope-flap" id="envelope-flap"></div>

      <!-- Pull-Tab translúcido de precisión -->
      <div class="envelope-pull" id="envelope-pull">
        <span class="pull-dot"></span>
      </div>

      <!-- Sello oficial Havaianas® -->

        </svg>
      </div>

      <div class="envelope-info">
        <span class="envelope-tag">GIFT CARD OFICIAL</span>
        <strong id="envelope-recipient">Para Sofía Martínez</strong>
        <small id="envelope-sender">De Lucas Fernández · $150.000 ARS</small>
      </div>
    </div>

    <div class="tap-hint">
      <span class="pulse-dot"></span>
      <span>Toca el sobre para abrir tu regalo</span>
    </div>
  </div>

  <!-- HUD SUPERIOR: MARCA + SELECTOR DE 5 ARMONÍAS PANTONE -->
  <header class="hud-top" id="hud-top">
    <div class="glass-pill brand-badge">
      <span class="brand-dot" id="hud-dot"></span>
      <span id="hud-brand">havaianas®</span>
      <span class="sep">·</span>
      <strong id="hud-amount">$150.000</strong>
    </div>

    <div class="glass-pill palette-bar" id="palette-bar" role="group" aria-label="Elegir color de Gift Card">
      <!-- Los 5 swatches se inyectan dinámicamente desde scene3d.js -->
    </div>
  </header>

  <!-- BARRA DE MODO LECTURA CERCANA (AL TOCAR UNA TARJETA) -->
  <div class="inspect-bar" id="inspect-bar" aria-hidden="true">
    <span id="inspect-label">Vista de Lectura — Frente</span>
    <button type="button" class="btn-close-inspect" id="btn-inspect-close">Volver</button>
  </div>

  <!-- HUD INFERIOR: POSICIÓN 1 / POSICIÓN 2 / COPIAR -->
  <nav class="hud-bottom-wrap" id="hud-bottom-wrap">
    <div class="micro-hint" id="micro-hint">Toca una tarjeta para leer de cerca · Arrastra para girar</div>
    <div class="glass-pill hud-bottom">
      <button type="button" class="btn-pill is-active" data-mode="front" id="btn-front">Vista Frontal</button>
      <button type="button" class="btn-pill" data-mode="studio" id="btn-studio">Vista Estudio</button>
      <button type="button" class="btn-pill btn-cta" id="btn-copy">Copiar Código</button>
    </div>
  </nav>

  <script type="module" src="./scene3d.js"></script>
</body>
</html>
